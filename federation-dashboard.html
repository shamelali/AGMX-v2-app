<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Papan Pemuka Federasi — AGMX Federation Platform">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <title>Papan Pemuka Federasi • AGMX</title>
</head>
<body>
  <a href="#app" class="skip-link">Lompat ke kandungan utama</a>
  <main class="page" style="max-width:1100px;margin:2rem auto;padding:0 1rem;">
    <header style="margin-bottom:2rem;">
      <h1 style="margin:0 0 0.5rem 0;">Papan Pemuka Federasi</h1>
      <p style="color:#666;margin:0;">Papan pemuka konsolidasi dan pengebilan gabungan bagi federasi koperasi</p>
    </header>

    <section style="border:1px solid #e5e7eb;border-radius:12px;padding:1.5rem;margin-bottom:2rem;background:#fff;">
      <h2 style="margin-top:0;font-size:1.1rem;color:#374151;">Butir Federasi</h2>
      <div id="fedLoading" style="padding:1rem;color:#64748b;">Memuatkan butir federasi...</div>
      <div id="fedCard" style="display:none;">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
          <div><div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;">Nama Federasi</div><div style="font-weight:600;color:#1e293b;" id="fedName">-</div></div>
          <div><div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;">Koperasi Anggota</div><div style="font-weight:600;color:#1e293b;" id="fedMemberCount">-</div></div>
          <div><div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;">Jumlah AGM</div><div style="font-weight:600;color:#1e293b;" id="fedAgmCount">-</div></div>
        </div>
      </div>
    </section>

    <section style="border:1px solid #e5e7eb;border-radius:12px;background:#fff;overflow:hidden;">
      <h2 style="margin:0 0 1rem 0;padding:1rem 1.5rem;font-size:1.1rem;color:#374151;border-bottom:1px solid #e5e7eb;">Koperasi Anggota</h2>
      <div id="fedMembersContainer" style="padding:1rem;">
        <table style="width:100%;border-collapse:collapse;font-size:0.875rem;">
          <thead>
            <tr style="background:#f8fafc;">
              <th style="padding:0.75rem;text-align:left;border-bottom:1px solid #e5e7eb;color:#64748b;">Koperasi</th>
              <th style="padding:0.75rem;text-align:left;border-bottom:1px solid #e5e7eb;color:#64748b;">Status</th>
              <th style="padding:0.75rem;text-align:left;border-bottom:1px solid #e5e7eb;color:#64748b;">Ahli</th>
              <th style="padding:0.75rem;text-align:right;border-bottom:1px solid #e5e7eb;color:#64748b;">AGM</th>
              <th style="padding:0.75rem;text-align:left;border-bottom:1px solid #e5e7eb;color:#64748b;">Pematuhan</th>
            </tr>
          </thead>
          <tbody id="fedTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module">
    import { AGMX_API } from './supabase-client.js';

    const fedName = document.getElementById('fedName');
    const fedMemberCount = document.getElementById('fedMemberCount');
    const fedAgmCount = document.getElementById('fedAgmCount');
    const fedLoading = document.getElementById('fedLoading');
    const fedCard = document.getElementById('fedCard');
    const fedTableBody = document.getElementById('fedTableBody');

    async function load() {
      try {
        if (!AGMX_API || !AGMX_API.isAuthenticated) {
          fedLoading.textContent = 'Sila log masuk terlebih dahulu.';
          return;
        }
        const isAuth = await AGMX_API.isAuthenticated();
        if (!isAuth) {
          fedLoading.textContent = 'Sesi tidak sah.';
          return;
        }

        const profile = await AGMX_API.profile.getCurrent();
        const [federations, fedOrgs] = await Promise.all([
          AGMX_API.distribution.getFederations(),
          AGMX_API.distribution.getFederationOrganizations(),
        ]);

        fedLoading.style.display = 'none';

        if (profile) {
          fedName.textContent = profile.organization?.name || '-';
        }
        fedCard.style.display = 'block';

        const orgCount = fedOrgs.length;
        fedMemberCount.textContent = orgCount;
        fedAgmCount.textContent = '0';

        fedTableBody.innerHTML = '';
        if (fedOrgs.length === 0) {
          fedTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--c-text-3);padding:20px">Tiada data koperasi anggota.</td></tr>';
          return;
        }

        for (const org of fedOrgs) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="padding:0.75rem;border-bottom:1px solid #f1f5f9;color:#374151;">${escapeHtml(org.organization_name || org.organization_id || '-')}</td>
            <td style="padding:0.75rem;border-bottom:1px solid #f1f5f9;"><span style="font-size:0.75rem;padding:0.15rem 0.5rem;border-radius:4px;background:#dcfce7;color:#166534">Aktif</span></td>
            <td style="padding:0.75rem;border-bottom:1px solid #f1f5f9;color:#374151;">${Number(org.member_count || 0).toLocaleString()}</td>
            <td style="padding:0.75rem;border-bottom:1px solid #f1f5f9;text-align:right;color:#374151;">${Number(org.agm_count || 0)}</td>
            <td style="padding:0.75rem;border-bottom:1px solid #f1f5f9;color:#374151;">${Number(org.compliance_score || 0)}%</td>
          `;
          fedTableBody.appendChild(tr);
        }
      } catch (e) {
        fedLoading.textContent = 'Ralat: ' + (e.message || e);
      }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
    }

    load();
  </script>
</body>
</html>
