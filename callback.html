<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>AGMX</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B5394'/%3E%3Ctext x='50%25' y='52%25' text-anchor='middle' dominant-baseline='central' font-family='Arial' font-weight='800' font-size='28' fill='%23D4A017'%3EAG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
  <style>
    .cb-body { min-height: 100vh; display: grid; place-items: center; padding: 24px; margin: 0; }
    .cb-card { max-width: 380px; text-align: center; }
    .cb-status { margin: 0 0 16px; font-weight: 600; }
  </style>
</head>
<body class="cb-body">
  <main class="card cb-card">
    <p class="cb-status" id="cb-status" role="status">Menyambungkan sesi…</p>
    <p><a class="btn btn-primary" id="cb-link" href="/app" hidden>Buka AGMX</a></p>
  </main>
  <script>
    // Google sign-in and the password-reset link come back here (they are the
    // URLs registered in Supabase's Redirect URLs, so the path cannot move).
    // The credentials ride in the URL fragment (implicit flow) or ?code=
    // (PKCE); neither reaches the server, so forwarding is the only way to
    // hand them to the Supabase client, which lives on /app and reads them
    // through detectSessionInUrl.
    (function () {
      var query = location.search || "";
      var hash = location.hash || "";
      var english = /(?:^|[?&])lang=en/.test(query);
      try { english = english || localStorage.getItem("agmx-lang") === "en"; } catch (_) {}

      document.documentElement.lang = english ? "en" : "ms";
      document.getElementById("cb-status").textContent =
        english ? "Connecting your session…" : "Menyambungkan sesi…";
      var link = document.getElementById("cb-link");
      link.textContent = english ? "Open AGMX" : "Buka AGMX";
      link.hidden = false;

      location.replace("/app" + query + hash);
      // A blocked or failed forward must not strand the visitor on this page.
      setTimeout(function () { link.focus(); }, 3000);
    }());
  </script>
</body>
</html>
