# ============================================================
# AGMX-v2-app — GitHub Actions CI/CD
# Tests on every push/PR; deploys to Vercel only when the
# VERCEL_TOKEN secret exists, otherwise the deploy steps skip.
# ============================================================
name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TEAM_SLUG: duta-integra

# Two pushes to main must not race two production deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      PB_URL: ${{ secrets.PB_URL }}
      PB_EMAIL: ${{ secrets.PB_EMAIL }}
      PB_PASSWORD: ${{ secrets.PB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # check.sh pass 16 type-checks supabase/functions/**/*.ts. Without deno
      # it reports a warning, so CI would never exercise the pass.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci --ignore-scripts
          else
            echo "No package.json — suites are dependency-free, nothing to install"
          fi

      - name: Run money flow tests
        run: node tools/test_money_flow.mjs

      - name: Run PocketBase tests
        if: env.PB_URL != ''
        run: node tools/test_money_flow_pb.mjs --url "$PB_URL" --email "$PB_EMAIL" --password "$PB_PASSWORD"

      - name: Run check.sh
        run: AGMX_SKIP_NET=1 bash tools/check.sh

  verify-deploy-author:
    name: Verify Deploy Author
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4

      # A deploy made from a git checkout is attributed to the latest commit's author,
      # and Vercel Blocks it when that email is not on the team — naming neither the
      # email nor the reason. Read the roster here so the failing step says what to
      # change. Nothing from the workflow event reaches the shell: the author comes
      # from git and is handed to python through an environment variable.
      - name: Confirm the commit author may deploy
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::notice::VERCEL_TOKEN or VERCEL_ORG_ID not set — author check skipped."
            exit 0
          fi
          author=$(git log -1 --format='%ae')
          echo "Latest commit author: $author"
          AGMX_AUTHOR="$author" python3 tools/check_deploy_author.py

  deploy-preview:
    name: Deploy Preview
    needs: [lint-and-test, verify-deploy-author]
    # Fork PRs have no access to VERCEL_TOKEN, so skip them instead of failing.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A job-level `if` cannot read `secrets`, so gate on presence here and let
      # the remaining steps no-op. Without this the repo — which has no Actions
      # secrets at all today — shows a red deploy job on every PR.
      - name: Check Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret not set — preview deploy skipped."
            echo "deploy_skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install Vercel CLI
        if: env.deploy_skip != 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        if: env.deploy_skip != 'true'
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Project Artifacts
        if: env.deploy_skip != 'true'
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel Preview
        if: env.deploy_skip != 'true'
        run: |
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ env.VERCEL_TEAM_SLUG }}")
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"

      - name: Comment PR with Preview URL
        if: env.deploy_skip != 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔗 Preview deployment: ${process.env.PREVIEW_URL}`
            })

  deploy-production:
    name: Deploy Production
    needs: [lint-and-test, verify-deploy-author]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret not set — production deploy skipped."
            echo "deploy_skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install Vercel CLI
        if: env.deploy_skip != 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        if: env.deploy_skip != 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Project Artifacts
        if: env.deploy_skip != 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel Production
        if: env.deploy_skip != 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ env.VERCEL_TEAM_SLUG }}")
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"

      - name: Notify Deployment
        if: env.deploy_skip != 'true'
        run: echo "Deployed to ${DEPLOY_URL}"
