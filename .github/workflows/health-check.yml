name: AGMX Health Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run health check
        run: bash tools/check.sh

      - name: Fail if checks fail
        if: failure()
        run: exit 1

      - name: Pass if checks succeed
        if: success()
        run: echo "✅ Ready for deployment"