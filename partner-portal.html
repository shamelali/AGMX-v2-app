<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal Mitra — AGMX Federation Platform">
  <meta name="theme-color" content="#2563EB">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <title>Portal Mitra • AGMX</title>
</head>
<body>
  <a href="#app" class="skip-link">Lompat ke kandungan utama</a>
  <main class="page" style="max-width:1100px;margin:2rem auto;padding:0 1rem;">
    <header style="margin-bottom:2rem;">
      <h1 style="margin:0 0 0.5rem 0;">Portal Mitra</h1>
      <p style="color:#666;margin:0;">Rakan perkhidmatan AGMX — pendaftaran, penurutan dan komisen federasi</p>
    </header>

    <section style="border:1px solid #e5e7eb;border-radius:12px;padding:1.5rem;margin-bottom:2rem;background:#fff;">
      <h2 style="margin-top:0;font-size:1.1rem;color:#374151;">Butir Mitra</h2>
      <div id="partnerLoading" style="padding:1rem;color:#64748b;">Memuatkan butir mitra...</div>
      <div id="partnerCard" style="display:none;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div><div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;">Nama Mitra</div><div style="font-weight:600;color:#1e293b;" id="partnerName">-</div></div>
          <div><div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;">E-mel</div><div style="font-weight:600;color:#1e293b;" id="partnerEmail">-</div></div>
          <div><div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;">Status</div><div style="font-weight:600;color:#16a34a;" id="partnerStatus">Aktif</div></div>
          <div><div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;">Komisen</div><div style="font-weight:600;color:#1e293b;" id="partnerCommission">0%</div></div>
        </div>
      </div>
    </section>

    <section style="border:1px solid #e5e7eb;border-radius:12px;background:#fff;overflow:hidden;">
      <h2 style="margin:0 0 1rem 0;padding:1rem 1.5rem;font-size:1.1rem;color:#374151;border-bottom:1px solid #e5e7eb;">Agm yang Dibalas</h2>
      <div id="referralsContainer" style="padding:1rem;">
        <table style="width:100%;border-collapse:collapse;font-size:0.875rem;">
          <thead>
            <tr style="background:#f8fafc;">
              <th style="padding:0.75rem;text-align:left;border-bottom:1px solid #e5e7eb;color:#64748b;">Rujukan</th>
              <th style="padding:0.75rem;text-align:left;border-bottom:1px solid #e5e7eb;color:#64748b;">Koperasi</th>
              <th style="padding:0.75rem;text-align:left;border-bottom:1px solid #e5e7eb;color:#64748b;">Status</th>
              <th style="padding:0.75rem;text-align:right;border-bottom:1px solid #e5e7eb;color:#64748b;">Komisen</th>
              <th style="padding:0.75rem;text-align:left;border-bottom:1px solid #e5e7eb;color:#64748b;">Didaftar</th>
            </tr>
          </thead>
          <tbody id="referralsTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module">
    import { AGMX_API } from './supabase-client.js';

    const partnerName = document.getElementById('partnerName');
    const partnerEmail = document.getElementById('partnerEmail');
    const partnerStatus = document.getElementById('partnerStatus');
    const partnerCommission = document.getElementById('partnerCommission');
    const partnerLoading = document.getElementById('partnerLoading');
    const partnerCard = document.getElementById('partnerCard');
    const tableBody = document.getElementById('referralsTableBody');

    async function load() {
      try {
        if (!AGMX_API || !AGMX_API.isAuthenticated) {
          partnerLoading.textContent = 'Sila log masuk terlebih dahulu.';
          return;
        }
        const isAuth = await AGMX_API.isAuthenticated();
        if (!isAuth) {
          partnerLoading.textContent = 'Sesi tidak sah.';
          return;
        }

        const profile = await AGMX_API.profile.getCurrent();
        const orgId = profile?.organization?.id;

        const [partners, partnerLinks] = await Promise.all([
          AGMX_API.distribution.getPartners(),
          AGMX_API.distribution.getPartnerLinks(),
        ]);

        partnerLoading.style.display = 'none';

        if (profile) {
          partnerName.textContent = profile.full_name || '-';
          partnerEmail.textContent = profile.email || '-';
        }
        partnerCard.style.display = 'block';

        tableBody.innerHTML = '';
        if (partnerLinks.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--c-text-3);padding:20px">Tiada rujukan yang dicatat.</td></tr>';
          return;
        }

        for (const link of partnerLinks) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="padding:0.75rem;border-bottom:1px solid #f1f5f9;font-weight:500;color:#374151;">${escapeHtml(link.reference_code || link.id || '-')}</td>
            <td style="padding:0.75rem;border-bottom:1px solid #f1f5f9;color:#374151;">${escapeHtml(link.cooperative_name || '-')}</td>
            <td style="padding:0.75rem;border-bottom:1px solid #f1f5f9;"><span style="font-size:0.75rem;padding:0.15rem 0.5rem;border-radius:4px;background:#dcfce7;color:#166534">${escapeHtml(link.status || 'active')}</span></td>
            <td style="padding:0.75rem;border-bottom:1px solid #f1f5f9;text-align:right;color:#374151;">${Number(link.commission_pct || 0).toFixed(1)}%</td>
            <td style="padding:0.75rem;border-bottom:1px solid #f1f5f9;color:#374151;">${link.created_at ? new Date(link.created_at).toLocaleDateString('ms-MY') : '—'}</td>
          `;
          tableBody.appendChild(tr);
        }
      } catch (e) {
        partnerLoading.textContent = 'Ralat: ' + (e.message || e);
      }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
    }

    load();
  </script>
</body>
</html>
